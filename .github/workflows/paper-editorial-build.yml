name: Build editorial paper revision
on:
  push:
    branches: [codex/paper-hypophora-visuals-20261105]
    paths:
      - '.github/paper-editorial-revision.py'
      - '.github/workflows/paper-editorial-build.yml'
permissions:
  contents: write
concurrency:
  group: paper-editorial-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'emmett08/engineering-work-observatory'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/paper-hypophora-visuals-20261105
      - name: Apply exact-base editorial changes and verify preservation
        run: python3 .github/paper-editorial-revision.py
      - name: Check the explanatory figures and existing mathematical examples
        run: |
          python3 paper/check_explanatory_figures.py
          python3 paper/check_measurement_examples.py
          python3 paper/check_sharp_identification.py
      - name: Install the paper's TeX dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Build the canonical paper and check references
        run: |
          make -C paper article
          if grep -E 'Overfull|There were undefined references|Citation .* undefined|Reference .* undefined' paper/build/main.log; then
            exit 1
          fi
          sha256sum paper/ai-assisted-software-engineering.pdf
      - name: Commit only the revised manuscript and its PDF to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/article/main.tex paper/article/event-history.tex paper/article/partial-identification.tex paper/article/design-based-estimation.tex paper/article/sampling-validation.tex paper/article/scalar-bounds.tex paper/ai-assisted-software-engineering.pdf
          git diff --cached --check
          git commit -m 'Explain mathematical transitions with hypophora and rebuild paper'
          git push origin HEAD:codex/paper-hypophora-visuals-20261105
