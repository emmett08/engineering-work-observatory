name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test execution adapters
        run: python3 -m unittest discover -s instrumentation -p 'test_*.py'
      - name: Configure execution evidence
        id: evidence
        uses: ./
        with:
          job-name: Rust checks (${{ matrix.os }})
          matrix: ${{ toJSON(matrix) }}
      - name: Test with an explicit tool receipt
        run: >-
          python3 "$OBSERVATORY_RECORDER" run --tool cargo
          --tool-version "$(cargo --version)" --purpose development
          --check-name cargo-test -- cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: cargo build --locked --release
      - name: Check exact measurement and identification examples
        run: |
          python3 paper/check_measurement_examples.py
          python3 paper/check_sharp_identification.py
          python3 paper/review/mas-model-2026-11-01/calculations/check_model.py --check
          python3 paper/study/ai-labour-causal/validate_protocol.py
          python3 paper/figures/shared-capacity/calculate.py --check
          python3 paper/forecasting/check_reference_results.py --self-test
      - name: Publish execution evidence
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: ./
        with:
          mode: publish
          directory: ${{ steps.evidence.outputs.directory }}
