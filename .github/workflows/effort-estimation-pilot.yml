name: Synthetic issue-linked effort pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - instrumentation/effort.py
      - instrumentation/effort/**
      - instrumentation/test_effort*.py
      - examples/effort/**
      - src/inference.rs
      - src/inference/**
      - docs/effort-estimation.md
      - .github/workflows/effort-estimation-pilot.yml

permissions:
  contents: read

jobs:
  synthetic-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build the existing labour estimator
        run: cargo build --locked
      - name: Check activity collection and sampling behavior
        run: python3 -m unittest discover -s instrumentation -p 'test_effort*.py'
      - name: Replay manufactured activity and responses
        run: >-
          python3 examples/effort/replay.py
          --observatory target/debug/observatory
          --output-dir "$RUNNER_TEMP/effort-synthetic"
      - name: Publish only the manufactured pilot artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: synthetic-effort-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/effort-synthetic/
          if-no-files-found: error
          retention-days: 14
