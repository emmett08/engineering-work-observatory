name: Labour proof checks
on:
  push:
    paths:
      - 'paper/formal/**'
      - 'paper/article/partial-identification.tex'
      - '.github/workflows/labour-formal.yml'
  pull_request:
    paths:
      - 'paper/formal/**'
      - 'paper/article/partial-identification.tex'
      - '.github/workflows/labour-formal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - name: Install pinned Lean toolchain
        run: bash paper/effort-speed-ai/formal/scripts/bootstrap_lean.sh "$RUNNER_TEMP/labour-lean"
      - name: Obtain pinned mathlib build cache when available
        working-directory: paper/formal
        run: |
          export PATH="$RUNNER_TEMP/labour-lean/bin:$PATH"
          if ! lake exe cache get Mathlib.MeasureTheory.Integral.IntervalIntegral.Basic Mathlib.MeasureTheory.Integral.Bochner.Set Mathlib.Algebra.Order.BigOperators.Ring.Finset Mathlib.MeasureTheory.Measure.Typeclasses.Probability; then
            echo 'Cache unavailable; the verification step will build the pinned sources.'
          fi
      - name: Build, audit axioms and replay proofs
        run: |
          export PATH="$RUNNER_TEMP/labour-lean/bin:$PATH"
          make -C paper formal
