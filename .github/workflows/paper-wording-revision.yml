name: Paper wording revision
on:
  push:
    branches: [codex/paper-hypophora-visuals-20261105]
    paths: ['.github/workflows/paper-wording-revision.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Recover and verify pending paragraph edits
        run: |
          python3 .github/paper-wording-apply.py
          tar -czf export/recovered-paper.tar.gz paper .github/paper-wording-apply.py .github/wording-payload
          find . -name AGENTS.md -not -path './.git/*' -print -exec cat {} \; > export/repository-instructions.txt
          git rev-parse HEAD > export/recovery-head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovered-paper-sources
          path: export/
          retention-days: 3
