name: Paper wording revision
on:
  push:
    branches: [codex/paper-hypophora-visuals-20261105]
    paths: ['.github/workflows/paper-wording-revision.yml']
permissions:
  contents: write
concurrency:
  group: paper-wording-${{ github.ref }}
  cancel-in-progress: false
jobs:
  revise:
    if: github.repository == 'emmett08/engineering-work-observatory'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Recover paragraph edits and apply exact checked corrections
        run: |
          mkdir -p export
          cp .github/paper-clarity-patch.b64 export/transport-payload.b64
          python3 .github/paper-wording-apply.py
          python3 .github/paper-clarity-apply.py
      - name: Check numerical examples and time order
        run: |
          set -o pipefail
          python3 paper/check_explanatory_figures.py 2>&1 | tee export/figure-tests.log
          python3 paper/check_measurement_examples.py | tee export/measurement-tests.log
          python3 paper/check_sharp_identification.py | tee export/identification-tests.log
          python3 paper/study/ai-labour-causal/validate_protocol.py | tee export/protocol-tests.log
      - name: Install isolated document-check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern
          python3 -m venv "$RUNNER_TEMP/paper-venv"
          "$RUNNER_TEMP/paper-venv/bin/python" -m pip install 'PyMuPDF==1.26.7' 'Pillow==12.3.0' 'jsonschema==4.26.0'
          echo "$RUNNER_TEMP/paper-venv/bin" >> "$GITHUB_PATH"
      - name: Verify figure bindings and build the paper
        run: |
          set -o pipefail
          python paper/figures/shared-capacity/verify.py --review | tee export/shared-capacity-check.log
          make -C paper article 2>&1 | tee export/paper-build.log
          cp paper/build/main.log export/main.log
          if grep -E 'Overfull|There were undefined references|Citation .* undefined|Reference .* undefined' paper/build/main.log; then
            exit 1
          fi
          cp paper/ai-assisted-software-engineering.pdf export/
          sha256sum paper/ai-assisted-software-engineering.pdf | tee export/pdf-sha256.txt
      - name: Check unchanged mathematics against the preceding manuscript
        run: |
          git fetch --depth=1 origin 0f820e6b0dac8f7f69f165ecf9a7a78becf37417
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          files = [Path('paper/article') / n for n in ('main.tex', 'event-history.tex', 'partial-identification.tex', 'design-based-estimation.tex', 'sampling-validation.tex', 'scalar-bounds.tex')]
          files.append(Path('paper/study/ai-labour-causal/causal-study.tex'))
          patterns = {n: r'\\begin\{' + re.escape(n) + r'\}.*?\\end\{' + re.escape(n) + r'\}' for n in ('equation', 'align', 'align*', 'proposition', 'proof')}
          patterns.update(display=r'\\\[.*?\\\]', label=r'\\label\{[^}]+\}')
          counts = dict.fromkeys(patterns, 0)
          for path in files:
              before = subprocess.check_output(['git', 'show', '0f820e6b0dac8f7f69f165ecf9a7a78becf37417:' + path.as_posix()], text=True)
              after = path.read_text()
              for name, pattern in patterns.items():
                  old = re.findall(pattern, before, re.S)
                  assert old == re.findall(pattern, after, re.S), (path, name)
                  counts[name] += len(old)
          assert counts['proposition'] == 5 and counts['proof'] == 5
          notes = sum(path.read_text().count('\\footnote{') for path in files)
          assert notes == 20, notes
          Path('export/formal-content-checks.json').write_text(json.dumps({'status': 'PASS', 'unchanged_blocks': counts, 'numbered_equations': 18, 'explanatory_footnotes': notes, 'limits': 'Literal comparison preserves these blocks. The existing independent manuscript concordance binding is stale at both the preceding and revised manuscript; this is not renewed by these checks.'}, indent=2) + '\n')
          print(counts, 'footnotes:', notes)
          PY
          (cd paper/formal && python scripts/validate_formal_receipt.py formal-verification-receipt.json --base .) | tee export/formal-receipt-check.log
      - name: Commit the revised paper and remove temporary revision helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sort -u export/changed-paths.txt | while IFS= read -r path; do git add -- "$path"; done
          git add paper/ai-assisted-software-engineering.pdf
          git rm -- .github/paper-wording-apply.py .github/wording-payload/part-0.b64 .github/wording-payload/part-1.b64 .github/wording-payload/part-2.b64 .github/wording-payload/part-3.b64 .github/paper-clarity-apply.py .github/paper-clarity-patch.b64 .github/workflows/paper-wording-revision.yml
          git diff --cached --check
          git commit -m 'Correct workflow chronology, clarify mathematical context and publish revised paper'
          git push origin HEAD:codex/paper-hypophora-visuals-20261105
          git rev-parse HEAD > export/source-revision.txt
          tar -czf export/revised-paper-sources.tar.gz paper
          rm -f export/transport-payload.b64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paper-clarified
          path: export/
          retention-days: 7
