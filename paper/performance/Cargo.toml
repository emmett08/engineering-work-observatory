[package]
name = "cohort-horizon-performance"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "horizon-bench"
path = "src/bin/horizon-bench.rs"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "unwind"
overflow-checks = true
