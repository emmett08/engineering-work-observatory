[package]
name = "engineering-work-observatory"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Evidence-preserving task, effort, delivery and retained-output measurement"
license = "GPL-3.0-only"
repository = "https://github.com/emmett08/engineering-work-observatory"

[lib]
name = "observatory"

[[bin]]
name = "observatory"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
sha2 = "0.11"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
